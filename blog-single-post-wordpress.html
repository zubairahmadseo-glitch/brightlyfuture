<style>
#post-wrap {
  --bg: #E8E0F0;
  --pri: #6C5CE7;
  --pri-hover: #5A4BD1;
  --heading: #1A1744;
  --card-bg: #FFFFFF;
  --text: #2D2B55;
  --muted: #6B6490;
  --card-border: #D0C6E0;
  --bg-alt: #DDD4EB;
  --green: #00C897;
}
#post-wrap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--text); line-height: 1.8; }
#post-wrap * { box-sizing: border-box; }
#post-wrap a { color: var(--pri); text-decoration: none; }
#post-wrap a:hover { color: var(--pri-hover); }

/* Reading progress bar */
#post-wrap .post-progress { position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 9999; background: transparent; }
#post-wrap .post-progress-bar { height: 100%; width: 0%; background: var(--pri); transition: width 0.1s linear; }

/* Container */
#post-wrap .post-container { max-width: 750px; margin: 0 auto; padding: 32px 20px 48px; }

/* Breadcrumb - Yoast / RankMath / WP defaults */
#post-wrap .breadcrumb,
#post-wrap .yoast-breadcrumb,
#post-wrap .rank-math-breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
#post-wrap .breadcrumb a,
#post-wrap .yoast-breadcrumb a,
#post-wrap .rank-math-breadcrumb a { color: var(--muted); }
#post-wrap .breadcrumb a:hover,
#post-wrap .yoast-breadcrumb a:hover,
#post-wrap .rank-math-breadcrumb a:hover { color: var(--pri); }

/* Post header */
#post-wrap .entry-header { margin-bottom: 28px; }
#post-wrap .entry-title,
#post-wrap .post-container h1 { font-size: 2.2rem; color: var(--heading); line-height: 1.25; margin: 0 0 16px; }

/* Post meta */
#post-wrap .entry-meta,
#post-wrap .post-meta { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 0.88rem; color: var(--muted); margin-bottom: 20px; }
#post-wrap .cat-links a { background: rgba(108,92,231,0.1); color: var(--pri); padding: 4px 14px; border-radius: 16px; font-size: 0.82rem; font-weight: 600; text-decoration: none; }

/* Author row */
#post-wrap .author-info,
#post-wrap .post-author { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
#post-wrap .author-info .avatar,
#post-wrap .post-author img { width: 44px; height: 44px; border-radius: 50%; }
#post-wrap .author-info .author-name { font-weight: 600; color: var(--heading); font-size: 0.95rem; }
#post-wrap .author-info .author-role { color: var(--muted); font-size: 0.82rem; }

/* Featured image */
#post-wrap .post-thumbnail img,
#post-wrap .wp-post-image { width: 100%; border-radius: 14px; margin-bottom: 28px; display: block; }

/* Article content */
#post-wrap .entry-content h2 { font-size: 1.55rem; color: var(--heading); margin: 36px 0 14px; padding-top: 8px; }
#post-wrap .entry-content h3 { font-size: 1.2rem; color: var(--heading); margin: 28px 0 10px; }
#post-wrap .entry-content h4 { font-size: 1.05rem; color: var(--heading); margin: 22px 0 8px; }
#post-wrap .entry-content p { margin-bottom: 18px; color: var(--text); font-size: 1.02rem; }
#post-wrap .entry-content ul,
#post-wrap .entry-content ol { margin: 0 0 18px 24px; color: var(--text); }
#post-wrap .entry-content li { margin-bottom: 6px; }
#post-wrap .entry-content blockquote { border-left: 4px solid var(--pri); background: var(--bg-alt); padding: 18px 22px; margin: 24px 0; border-radius: 0 10px 10px 0; font-style: italic; color: var(--muted); }
#post-wrap .entry-content img { max-width: 100%; height: auto; border-radius: 10px; margin: 20px 0; }
#post-wrap .entry-content a { color: var(--pri); text-decoration: underline; }
#post-wrap .entry-content a:hover { color: var(--pri-hover); }
#post-wrap .entry-content code { background: var(--bg-alt); padding: 2px 8px; border-radius: 4px; font-size: 0.92rem; }
#post-wrap .entry-content pre { background: var(--heading); color: #E8E0F0; padding: 20px; border-radius: 10px; overflow-x: auto; margin: 20px 0; font-size: 0.9rem; line-height: 1.5; }
#post-wrap .entry-content table { width: 100%; border-collapse: collapse; margin: 20px 0; border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden; }
#post-wrap .entry-content th { background: var(--pri); color: #fff; padding: 12px 16px; text-align: left; font-weight: 600; }
#post-wrap .entry-content td { padding: 10px 16px; border-bottom: 1px solid var(--card-border); }

/* WP Gutenberg blocks */
#post-wrap .wp-block-image img { border-radius: 10px; }
#post-wrap .wp-block-quote { border-left: 4px solid var(--pri); background: var(--bg-alt); padding: 18px 22px; margin: 24px 0; border-radius: 0 10px 10px 0; }
#post-wrap .wp-block-quote p { font-style: italic; color: var(--muted); margin: 0; }
#post-wrap .wp-block-table table { width: 100%; border-collapse: collapse; border: 1px solid var(--card-border); }
#post-wrap .wp-block-table th { background: var(--pri); color: #fff; padding: 12px 16px; }
#post-wrap .wp-block-table td { padding: 10px 16px; border-bottom: 1px solid var(--card-border); }
#post-wrap .wp-block-separator { border: none; border-top: 2px solid var(--card-border); margin: 32px 0; }
#post-wrap .wp-block-buttons .wp-block-button__link { background: var(--pri); color: #fff; padding: 12px 28px; border-radius: 8px; font-weight: 600; }
#post-wrap .wp-block-buttons .wp-block-button__link:hover { background: var(--pri-hover); }
#post-wrap .wp-block-cover { border-radius: 12px; overflow: hidden; }
#post-wrap .wp-block-gallery { gap: 10px; }
#post-wrap .wp-block-gallery img { border-radius: 8px; }

/* Tags */
#post-wrap .tag-links,
#post-wrap .post-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0; }
#post-wrap .tag-links a,
#post-wrap .post-tags a { background: var(--bg-alt); color: var(--muted); padding: 4px 14px; border-radius: 16px; font-size: 0.82rem; font-weight: 500; text-decoration: none; }
#post-wrap .tag-links a:hover,
#post-wrap .post-tags a:hover { background: var(--pri); color: #fff; }

/* Share buttons - plugin styling */
#post-wrap .sharedaddy,
#post-wrap .post-share { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 32px 0; padding: 24px 0; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); }

/* Author bio box */
#post-wrap .author-box,
#post-wrap .about-author { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 28px; display: flex; gap: 20px; margin: 32px 0; }
#post-wrap .author-box .avatar { width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0; }
#post-wrap .author-box h3 { color: var(--heading); margin: 0 0 4px; font-size: 1.1rem; }
#post-wrap .author-box p { color: var(--muted); font-size: 0.92rem; margin: 0; }

/* Post navigation - prev/next */
#post-wrap .post-navigation { display: flex; justify-content: space-between; gap: 16px; margin: 32px 0; }
#post-wrap .post-navigation .nav-previous,
#post-wrap .post-navigation .nav-next { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px 20px; flex: 1; transition: border-color 0.2s; }
#post-wrap .post-navigation .nav-previous:hover,
#post-wrap .post-navigation .nav-next:hover { border-color: var(--pri); }
#post-wrap .post-navigation a { color: var(--heading); text-decoration: none; font-weight: 600; font-size: 0.95rem; }

/* Related posts */
#post-wrap .related-posts,
#post-wrap .jp-relatedposts { margin: 40px 0; }
#post-wrap .related-posts h2,
#post-wrap .jp-relatedposts h3 { font-size: 1.5rem; color: var(--heading); margin-bottom: 24px; text-align: center; }

/* Comments */
#post-wrap .comments-area { margin-top: 40px; }
#post-wrap .comments-title { font-size: 1.4rem; color: var(--heading); margin-bottom: 24px; }
#post-wrap .comment-list { list-style: none; margin: 0; padding: 0; }
#post-wrap .comment { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
#post-wrap .comment .avatar { width: 40px; height: 40px; border-radius: 50%; float: left; margin-right: 14px; }
#post-wrap .comment-author { font-weight: 600; color: var(--heading); }
#post-wrap .comment-metadata { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
#post-wrap .comment-metadata a { color: var(--muted); }
#post-wrap .comment-content p { color: var(--text); font-size: 0.95rem; }
#post-wrap .comment .reply a { color: var(--pri); font-size: 0.85rem; font-weight: 600; }
#post-wrap .children { margin-left: 32px; padding: 0; list-style: none; }

/* Comment form */
#post-wrap .comment-respond { margin-top: 32px; }
#post-wrap .comment-reply-title { font-size: 1.2rem; color: var(--heading); margin-bottom: 16px; }
#post-wrap .comment-form label { display: block; font-weight: 600; color: var(--heading); margin-bottom: 4px; font-size: 0.92rem; }
#post-wrap .comment-form input[type="text"],
#post-wrap .comment-form input[type="email"],
#post-wrap .comment-form input[type="url"],
#post-wrap .comment-form textarea { width: 100%; padding: 12px 16px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; font-family: inherit; margin-bottom: 16px; background: var(--card-bg); color: var(--text); }
#post-wrap .comment-form textarea { min-height: 140px; resize: vertical; }
#post-wrap .comment-form input:focus,
#post-wrap .comment-form textarea:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(108,92,231,0.15); }
#post-wrap .comment-form .submit { background: var(--pri); color: #fff; padding: 12px 28px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
#post-wrap .comment-form .submit:hover { background: var(--pri-hover); }

@media(max-width:768px){
  #post-wrap .entry-title,
  #post-wrap .post-container h1 { font-size: 1.6rem; }
  #post-wrap .author-box,
  #post-wrap .about-author { flex-direction: column; align-items: center; text-align: center; }
  #post-wrap .post-navigation { flex-direction: column; }
}
</style>
