<style>
#blog-wrap {
  --bg: #E8E0F0;
  --pri: #6C5CE7;
  --pri-hover: #5A4BD1;
  --heading: #1A1744;
  --card-bg: #FFFFFF;
  --text: #2D2B55;
  --muted: #6B6490;
  --card-border: #D0C6E0;
  --bg-alt: #DDD4EB;
  --green: #00C897;
}
#blog-wrap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--text); line-height: 1.7; }
#blog-wrap * { box-sizing: border-box; }

/* Hero */
#blog-wrap .blog-hero { text-align: center; padding: 56px 20px 40px; background: linear-gradient(135deg, var(--bg) 0%, var(--bg-alt) 100%); }
#blog-wrap .blog-hero h1 { font-size: 2.4rem; color: var(--heading); margin: 0 0 12px; }
#blog-wrap .blog-hero p { font-size: 1.1rem; color: var(--muted); max-width: 600px; margin: 0 auto; }

/* Post Grid - targets Elementor Posts widget & WP defaults */
#blog-wrap .elementor-posts-container,
#blog-wrap .blog-posts-area { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto; padding: 50px 20px; }

#blog-wrap .elementor-post,
#blog-wrap .blog-posts-area article { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
#blog-wrap .elementor-post:hover,
#blog-wrap .blog-posts-area article:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(108,92,231,0.12); }

/* Thumbnail */
#blog-wrap .elementor-post__thumbnail,
#blog-wrap .blog-posts-area .post-thumbnail { width: 100%; height: 180px; overflow: hidden; }
#blog-wrap .elementor-post__thumbnail img,
#blog-wrap .blog-posts-area .post-thumbnail img { width: 100%; height: 100%; object-fit: cover; }

/* Post card body */
#blog-wrap .elementor-post__text,
#blog-wrap .blog-posts-area .entry-content,
#blog-wrap .blog-posts-area .entry-summary { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* Category badge */
#blog-wrap .elementor-post__badge,
#blog-wrap .blog-posts-area .cat-links a { background: rgba(108,92,231,0.1); color: var(--pri); padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; display: inline-block; margin-bottom: 8px; text-decoration: none; }

/* Post meta */
#blog-wrap .elementor-post-date,
#blog-wrap .elementor-post__meta-data,
#blog-wrap .blog-posts-area .entry-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
#blog-wrap .elementor-post__meta-data span { margin-right: 10px; }

/* Post title */
#blog-wrap .elementor-post__title,
#blog-wrap .blog-posts-area .entry-title { font-size: 1.12rem; color: var(--heading); margin: 0 0 8px; line-height: 1.4; }
#blog-wrap .elementor-post__title a,
#blog-wrap .blog-posts-area .entry-title a { color: var(--heading); text-decoration: none; }
#blog-wrap .elementor-post__title a:hover,
#blog-wrap .blog-posts-area .entry-title a:hover { color: var(--pri); }

/* Excerpt */
#blog-wrap .elementor-post__excerpt,
#blog-wrap .blog-posts-area .entry-summary p { color: var(--muted); font-size: 0.92rem; line-height: 1.6; flex: 1; }

/* Read more */
#blog-wrap .elementor-post__read-more,
#blog-wrap .blog-posts-area .more-link { display: inline-block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; color: var(--pri); text-decoration: none; }
#blog-wrap .elementor-post__read-more:hover,
#blog-wrap .blog-posts-area .more-link:hover { color: var(--pri-hover); }

/* Pagination - Elementor & WP default */
#blog-wrap .elementor-pagination,
#blog-wrap .nav-links { display: flex; justify-content: center; gap: 8px; padding: 10px 20px 50px; flex-wrap: wrap; }
#blog-wrap .elementor-pagination .page-numbers,
#blog-wrap .nav-links .page-numbers { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 16px; font-size: 0.92rem; font-weight: 600; color: var(--text); text-decoration: none; transition: all 0.2s; }
#blog-wrap .elementor-pagination .page-numbers:hover,
#blog-wrap .nav-links .page-numbers:hover { border-color: var(--pri); color: var(--pri); }
#blog-wrap .elementor-pagination .page-numbers.current,
#blog-wrap .nav-links .page-numbers.current { background: var(--pri) !important; color: #fff !important; border-color: var(--pri) !important; }

/* No results */
#blog-wrap .elementor-posts-nothing-found,
#blog-wrap .no-results { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.1rem; }

@media(max-width:900px){
  #blog-wrap .elementor-posts-container,
  #blog-wrap .blog-posts-area { grid-template-columns: repeat(2, 1fr); }
}
@media(max-width:600px){
  #blog-wrap .blog-hero h1 { font-size: 1.7rem; }
  #blog-wrap .elementor-posts-container,
  #blog-wrap .blog-posts-area { grid-template-columns: 1fr; }
}
</style>

<div id="blog-wrap">

<!-- Hero - customize text as needed -->
<div class="blog-hero">
  <h1>BrightlyFuture Blog</h1>
  <p>Expert insights on digital marketing, AI writing, SEO strategies, social media, and web design to help your business grow online.</p>
</div>

<!-- Posts will be rendered here by WordPress/Elementor Posts widget -->
<!-- Use Elementor Posts widget or Archive Posts widget inside this wrapper -->
<!-- Set "Posts Per Page" to 9 in the widget settings for pagination after 9 posts -->

</div>
